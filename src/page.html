<title>Veille Chine du Sud</title>
<meta name="description" content="Veille économique sur la Chine du Sud : carte des brèves, synthèses, mode 5 minutes et sources.">
<!--CSS-->

<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <div class="seal" aria-hidden="true">华南</div>
      <div>
        <h1>Veille Chine du Sud</h1>
        <div class="sub">Circonscriptions de Canton et de Chengdu</div>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Vues">
      <button role="tab" data-view="today" aria-selected="true">Aujourd'hui</button>
      <button role="tab" data-view="syntheses" aria-selected="false">Synthèses</button>
      <button role="tab" data-view="fil" aria-selected="false">Fil des brèves <span class="count" id="cnt-fil"></span></button>
      <button role="tab" data-view="sources" aria-selected="false">Sources</button>
    </nav>
    <div class="tools">
      <button class="iconbtn" id="btn-theme" type="button" aria-label="Passer en mode sombre" title="Mode sombre"></button>
    </div>
  </header>
  <div class="dateline"><span id="dl-today">—</span><span>Collecte : <b id="dl-collect">—</b></span><span id="dl-fx"></span><span id="dl-snap" class="snap" hidden></span></div>

  <!-- AUJOURD'HUI -->
  <section id="view-today" class="today">
    <div class="morning" id="morning" aria-live="polite"></div>

    <div class="stage" id="stage">
      <div class="mapbox" id="mapbox">
        <svg id="map" role="img" aria-label="Carte de la Chine du Sud avec les brèves géolocalisées"></svg>
        <div class="tip" id="tip"></div>
        <div class="zoomhint" id="zoomhint">Pour zoomer : ⌘ ou Ctrl + molette, ou pincez</div>
      </div>
      <div class="glass frames" role="group" aria-label="Cadrage de la carte">
        <div class="seg" id="frames">
          <button data-f="sud" aria-pressed="true">Chine du Sud</button>
          <button data-f="delta" aria-pressed="false">Delta des Perles</button>
          <button data-f="fujian" aria-pressed="false">Côte du Fujian</button>
          <button data-f="sichuan" aria-pressed="false">Sichuan–Chongqing</button>
        </div>
        <div class="zoombtns">
          <button id="zoom-in" aria-label="Zoomer">+</button>
          <button id="zoom-out" aria-label="Dézoomer">−</button>
        </div>
      </div>
      <div class="glass legend-panel" id="legend-panel">
        <div class="legend">
          <span><i class="sw sw-cj"></i>Conjoncture</span>
          <span><i class="sw sw-fm"></i>Fait marquant</span>
          <span><i class="sw sw-op"></i>Opportunité</span>
          <span><i class="sw sw-prov"></i>Provincial</span>
        </div>
        <div class="timeline" id="timeline"></div>
        <span class="basemap-note" id="basemap-note"></span>
      </div>
      <aside class="glass side" id="side" aria-label="Brèves"></aside>
    </div>

    <article class="paper reading cinq" id="cinq-body"></article>
  </section>

  <!-- SYNTHESES -->
  <section id="view-syntheses" hidden>
    <article class="paper reading">
      <div class="subtabs"><div class="seg" id="synth-seg">
        <button data-p="jour" aria-pressed="true">Jour</button>
        <button data-p="semaine" aria-pressed="false">Semaine</button>
        <button data-p="mois" aria-pressed="false">Mois</button>
      </div></div>
      <div id="synth-body"></div>
    </article>
  </section>

  <!-- FIL -->
  <section id="view-fil" class="fil-view" hidden>
    <div class="glass filters-block" id="filters-fil" aria-label="Filtres"></div>
    <div class="paper fil-panel">
      <div class="toolbar">
        <span>Grouper par</span>
        <div class="seg" id="groupby">
          <button data-g="date" aria-pressed="true">Date</button>
          <button data-g="rubrique" aria-pressed="false">Rubrique du SER</button>
          <button data-g="zone" aria-pressed="false">Zone</button>
        </div>
        <span id="fil-meta" class="muted" style="margin-left:auto"></span>
      </div>
      <div class="fil-list" id="fil-list"></div>
    </div>
  </section>

  <!-- SOURCES -->
  <section id="view-sources" hidden>
    <div class="paper" style="overflow:hidden">
      <div class="srcsum" id="src-sum"></div>
      <div class="tablewrap"><table class="src" id="src-table"></table></div>
    </div>
  </section>
</div>

<dialog class="fiche" id="fiche" aria-labelledby="fiche-title">
  <div class="fbody" id="fiche-body"></div>
  <div class="actions">
    <span class="status-line" id="fiche-status"></span>
    <button class="btn" id="btn-reject" hidden>Rejeter</button>
    <button class="btn" id="btn-validate" hidden>Valider et publier</button>
    <button class="btn" id="btn-copy">Copier la brève</button>
    <button class="btn primary" id="btn-close">Fermer</button>
  </div>
</dialog>

<!--JS-->
